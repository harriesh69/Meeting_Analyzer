# Local cluster (kind) with the fake backend: used by CI to test the
# manifests end to end without downloading models.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources: [../../base]
images:
  - {name: meeting-analyzer-api, newName: meeting-analyzer-api, newTag: ci}
  - {name: meeting-analyzer-worker, newName: meeting-analyzer-worker, newTag: ci}
  - {name: meeting-analyzer-ui, newName: meeting-analyzer-ui, newTag: ci}
patches:
  - target: {kind: ConfigMap, name: analyzer-config}
    patch: |-
      - {op: replace, path: /data/ANALYZER_BACKEND, value: fake}
      - {op: replace, path: /data/HEARTBEAT_TTL_SECONDS, value: "10"}
      - {op: add, path: /data/FAKE_DELAY, value: "20"}
  - target: {kind: Deployment, name: worker}
    patch: |-
      - {op: replace, path: /spec/replicas, value: 2}
      - {op: replace, path: /spec/template/spec/containers/0/resources, value: {requests: {cpu: 50m, memory: 128Mi}}}
      - {op: replace, path: /spec/template/spec/terminationGracePeriodSeconds, value: 30}
  - target: {kind: Deployment, name: api}
    patch: |-
      - {op: replace, path: /spec/template/spec/containers/0/resources/requests, value: {cpu: 50m, memory: 64Mi}}
  - target: {kind: HorizontalPodAutoscaler, name: worker}
    patch: |-
      - {op: replace, path: /spec/minReplicas, value: 2}
      - {op: replace, path: /spec/maxReplicas, value: 2}
