name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: Unit and service tests
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    env:
      REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: pytest -q

  manifests:
    name: Validate Kubernetes manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install kubeconform
        run: |
          curl -sL https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz | tar xz
          sudo mv kubeconform /usr/local/bin/
      - name: Render and validate every overlay
        run: |
          for o in k8s/base k8s/overlays/kind k8s/overlays/cloud; do
            kubectl kustomize "$o" | kubeconform -strict -summary -kubernetes-version 1.30.0 -
          done

  kubernetes:
    name: Deploy to kind and run end-to-end test
    needs: [test, manifests]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build images (worker without ML libraries; fake backend)
        run: |
          docker build -f docker/api.Dockerfile -t meeting-analyzer-api:ci .
          docker build -f docker/worker.Dockerfile --build-arg INSTALL_ML=false -t meeting-analyzer-worker:ci .
          docker build -f docker/ui.Dockerfile -t meeting-analyzer-ui:ci .
      - uses: helm/kind-action@v1
        with:
          cluster_name: ci
      - name: Load images into kind
        run: |
          for i in api worker ui; do kind load docker-image meeting-analyzer-$i:ci --name ci; done
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: scripts/k8s-smoke-test.sh
      - name: Dump cluster state on failure
        if: failure()
        run: |
          kubectl -n meeting-analyzer get all
          kubectl -n meeting-analyzer logs -l app=worker --tail=100 --prefix
          kubectl -n meeting-analyzer logs -l app=api --tail=50 --prefix

  worker-image:
    name: Build full worker image (with models' libraries)
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f docker/worker.Dockerfile -t meeting-analyzer-worker:full .
      - name: Libraries import inside the image
        run: docker run --rm meeting-analyzer-worker:full python -c "import whisper, pyannote.audio, sentence_transformers, transformers; print('ok')"
